name: Cross-Platform Test Suite (Linux, Windows, macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-cross-platform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-pil xvfb

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow bleak qrcode

      - name: 🔍 Compile All Python Files (Syntax Check)
        shell: bash
        run: |
          echo "Compiling all Python files across Linux, Windows, macOS, and Web editions..."
          python -m py_compile $(find . -name "*.py" -o -name "*.pyw")
          echo "✅ All Python files compiled with 0 errors!"

      - name: 🧪 Test Legacy Instax Virtual Simulator (SP-1, SP-2, SP-3)
        shell: bash
        run: |
          echo "Testing Virtual SP-2 Status Query..."
          python Legacy-Instax-Printer/Linux/legacy_instax_printer.py --simulate --status

          TEST_IMG="Legacy-Instax-Printer/macOS/Resources/AppIcon.iconset/icon_512x512.png"

          echo "Testing SP-1 Dry Run Simulation (600x800 Mini Film)..."
          python Legacy-Instax-Printer/Linux/legacy_instax_printer.py --simulate --model SP-1 --dry-run "$TEST_IMG"

          echo "Testing SP-2 Dry Run Simulation (600x800 Mini Film)..."
          python Legacy-Instax-Printer/Linux/legacy_instax_printer.py --simulate --model SP-2 --dry-run "$TEST_IMG"

          echo "Testing SP-3 Dry Run Simulation (800x800 SQUARE Film)..."
          python Legacy-Instax-Printer/Linux/legacy_instax_printer.py --simulate --model SP-3 --dry-run "$TEST_IMG"

          echo "✅ All 3 Instax SHARE models passed virtual Wi-Fi transfer tests!"

      - name: 🤖 Run Full Test Suite & GUI Robot Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run python test_suite.py
            xvfb-run python test_gui.py
          else
            python test_suite.py
            python test_gui.py
          fi

      - name: 🧪 Test BLE Link Printer CLI Preview Engine
        shell: bash
        run: |
          TEST_IMG="Legacy-Instax-Printer/macOS/Resources/AppIcon.iconset/icon_512x512.png"
          python Linux/instax_printer.py preview "$TEST_IMG" --output test_square_preview.jpg
          test -f test_square_preview.jpg && rm -f test_square_preview.jpg
          echo "✅ BLE Printer CLI preview rendered successfully!"

      - name: 📜 Validate Shell and Command Script Syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for script in $(find . -name "*.sh" -o -name "*.command"); do
            echo "Checking syntax: $script"
            bash -n "$script"
          done
          echo "✅ All shell and macOS command scripts passed syntax validation!"

      - name: 🛡️ Verify Web Studio Canonical Architecture & Bridge Consistency
        shell: bash
        run: |
          echo "Verifying canonical Web Studios & bridge scripts integrity..."
          python -c "
          import os, hashlib, sys
          ble_html = 'Web-Bluetooth-Offline/InstaxPrinterWeb.html'
          legacy_html = 'Legacy-Instax-Printer/Web-WiFi-Offline/LegacyInstaxPrinterWeb.html'
          assert os.path.isfile(ble_html) and os.path.getsize(ble_html) > 1000, 'BLE HTML missing'
          assert os.path.isfile(legacy_html) and os.path.getsize(legacy_html) > 1000, 'Legacy HTML missing'

          ble_bridges = ['macOS/instax_wifi_bridge.py', 'Linux/instax_wifi_bridge.py', 'Windows/instax_wifi_bridge.py', 'Web-Bluetooth-Offline/instax_wifi_bridge.py']
          legacy_bridges = ['Legacy-Instax-Printer/macOS/legacy_web_bridge.py', 'Legacy-Instax-Printer/Linux/legacy_web_bridge.py', 'Legacy-Instax-Printer/Windows/legacy_web_bridge.py', 'Legacy-Instax-Printer/Web-WiFi-Offline/legacy_web_bridge.py']
          assert len(set(hashlib.md5(open(f, 'rb').read()).hexdigest() for f in ble_bridges)) == 1, 'BLE bridge mismatch'
          assert len(set(hashlib.md5(open(f, 'rb').read()).hexdigest() for f in legacy_bridges)) == 1, 'Legacy bridge mismatch'
          print('✅ Canonical Web Studios verified & bridge scripts match identically across all OS platforms')
          "
